; PlatformIO project file for estimator-crossover-hardware.
;
; Build the firmware:     pio run
; Upload to the ESP32:    pio run -t upload
; Open the serial port:   pio device monitor
;
; The firmware source lives in firmware/ (not the PlatformIO default src/),
; so we tell PlatformIO where to look.

[platformio]
src_dir = firmware/src
include_dir = firmware/include
lib_dir = lib
default_envs = esp32dev, esp32dev_guard

; Settings shared by every build below.
[env]
; Versions are pinned so the build is the same on every computer and in CI.
platform = espressif32 @ 6.9.0
board = esp32doit-devkit-v1
framework = arduino
; 921600 baud: fast enough for one CSV row every 33 ms with room to spare.
monitor_speed = 921600
monitor_filters = direct
lib_deps =
    pololu/VL53L0X @ 1.3.1
; Use C++17 (the default for this core is the older gnu++11).
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    ; Never fuse a*b+c into one instruction: keeps the estimators bit-for-bit
    ; identical to the Python versions (see tests/test_estimators.py).
    -ffp-contract=off
    ; Stamps the current git commit into the firmware so every data file
    ; records exactly which code produced it (test card field 7).
    !python3 scripts/git_rev.py

; Normal build: Blocks A-F. Our own sensor_guard.h handles timeouts and hangs.
[env:esp32dev]
lib_ignore = sel_guard

; Block G (integrated live run): the Spec 2 guard in lib/sel_guard owns the
; sensor. Build and upload with:  pio run -e esp32dev_guard -t upload
[env:esp32dev_guard]
build_flags =
    ${env.build_flags}
    -DUSE_SEL_GUARD
